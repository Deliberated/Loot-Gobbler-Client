# Pushing a version tag (v + the version in rust/Cargo.toml, e.g. v0.10.0) builds Loot Gobbler for Windows and Linux
# and publishes them as a release of this repository, where the in-app updater looks for new versions.
#
# Release title: the subject of the tagged commit ("v0.10.0: Title"). Release notes: RELEASE_NOTES.md.
# Run by hand (Actions > Release > Run workflow, or `gh workflow run release.yml`) it only builds both platforms as a
# test and publishes nothing.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: rust

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - name: Check the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: grep -q "^version = \"${GITHUB_REF_NAME#v}\"$" Cargo.toml || { echo "rust/Cargo.toml version is not ${GITHUB_REF_NAME#v}"; exit 1; }
      - run: cargo build --release -p lg-gobbler
      - name: exe and portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/LootGobbler | Out-Null
          Copy-Item target/release/loot-gobbler.exe dist/LootGobbler.exe
          Copy-Item target/release/loot-gobbler.exe dist/LootGobbler/LootGobbler.exe
          Copy-Item ../LICENSE, ../THIRD_PARTY_LICENSE-RealmShark.md dist/LootGobbler/
          Compress-Archive -Path dist/LootGobbler -DestinationPath dist/LootGobbler-portable.zip
          # the program answers its version (the updater checks a download with it)
          $v = (& dist/LootGobbler.exe --version | Out-String).Trim()
          if ($env:GITHUB_REF_NAME -like 'v*' -and "v$v" -ne $env:GITHUB_REF_NAME) { throw "LootGobbler.exe is $v, the tag $env:GITHUB_REF_NAME" }
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            rust/dist/LootGobbler.exe
            rust/dist/LootGobbler-portable.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04   # an older glibc, so it runs on most distributions
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - run: cargo build --release -p lg-gobbler
      - name: tar.gz
        run: |
          mkdir -p dist/LootGobbler
          cp target/release/loot-gobbler dist/LootGobbler/LootGobbler
          cp ../LICENSE ../THIRD_PARTY_LICENSE-RealmShark.md dist/LootGobbler/
          cat > dist/LootGobbler/README.txt <<'TXT'
          Loot Gobbler for Linux

          Start it with ./LootGobbler (its records are kept next to it).
          To capture the game it needs the right to read network traffic, once:
              sudo setcap cap_net_raw,cap_net_admin=eip ./LootGobbler
          TXT
          tar -C dist -czf dist/LootGobbler-linux-x86_64.tar.gz LootGobbler
      - name: rpm (installed in /opt, with the capture rights)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q rpm
          version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          rpmbuild -bb packaging/linux/lootgobbler.spec --define "_topdir $RUNNER_TEMP/rpm" \
            --define "app_version $version" --define "app_image $PWD/dist/LootGobbler" \
            --define "desktop_file $PWD/packaging/linux/lootgobbler.desktop" \
            --define "icon_file $PWD/assets/icon/lootgobbler-256.png"
          cp "$RUNNER_TEMP"/rpm/RPMS/x86_64/lootgobbler-*.rpm dist/LootGobbler-x86_64.rpm
          rpm -qp --filecaps dist/LootGobbler-x86_64.rpm | grep -q 'LootGobbler.*cap_net_raw' \
            || { echo "the program in the rpm has no capture capabilities"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            rust/dist/LootGobbler-linux-x86_64.tar.gz
            rust/dist/LootGobbler-x86_64.rpm
          if-no-files-found: error

  release:
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Check the release notes
        run: grep -q '[^[:space:]]' RELEASE_NOTES.md || { echo "RELEASE_NOTES.md is empty"; exit 1; }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="$(git log -1 --format=%s "$GITHUB_REF_NAME")"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$title" --notes-file RELEASE_NOTES.md \
            dist/LootGobbler.exe dist/LootGobbler-portable.zip dist/LootGobbler-linux-x86_64.tar.gz dist/LootGobbler-x86_64.rpm
